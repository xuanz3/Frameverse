name: Quality checks
on:
  push:
    branches: [main, 'feature/**', 'fix/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  html-and-behaviour:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify generated pages are up to date
        run: |
          python build.py
          git diff --exit-code
      - name: Check HTML and navigation
        run: python -m unittest discover -s tests -p 'test_*.py'
